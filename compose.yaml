name: aigis

services:
  bot:
    build: .
    image: aigis-bot
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/aigis.db
      BACKUP_DIR: /backups
    volumes:
      - data:/data
      # Outside the Docker volume, so backups survive if Docker's data is lost.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  data:
